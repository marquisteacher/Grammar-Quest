<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar Quest 🎮</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0a1a; --panel:#12122a; --panel2:#1a1a38;
  --accent:#f7c948; --accent2:#ff5f6d; --accent3:#43e97b; --accent4:#38f9d7;
  --t1:#ff5f6d; --t2:#f7c948; --t3:#43e97b; --t4:#38f9d7;
  --text:#f0f0ff; --dim:#888aaa; --border:rgba(255,255,255,0.08);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;}

/* ── STARS ── */
#stars{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* ── SCREENS ── */
.screen{display:none;position:relative;z-index:1;}
.screen.active{display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px;}

/* ── SIGN-IN ── */
#signin-screen{justify-content:center;gap:24px;}
.logo-wrap{text-align:center;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:clamp(3rem,10vw,6rem);letter-spacing:4px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 30px rgba(247,201,72,.5));animation:glow 3s ease-in-out infinite;}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 20px rgba(247,201,72,.3))}50%{filter:drop-shadow(0 0 50px rgba(247,201,72,.7))}}
.tagline{color:var(--dim);font-size:1rem;letter-spacing:3px;text-transform:uppercase;margin-top:6px;}

.signin-card{background:var(--panel);border:1px solid var(--border);border-radius:24px;padding:32px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.signin-card h2{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:2px;color:var(--accent);margin-bottom:20px;text-align:center;}
.field-group{display:flex;flex-direction:column;gap:14px;margin-bottom:20px;}
.field-label{font-size:.8rem;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:4px;}
.field-input{width:100%;padding:14px 16px;background:rgba(255,255,255,.05);border:2px solid var(--border);
  border-radius:12px;color:var(--text);font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;
  transition:border-color .2s;}
.field-input:focus{outline:none;border-color:var(--accent);}
.field-input::placeholder{color:var(--dim);font-weight:400;}
.signin-btn{width:100%;padding:16px;background:linear-gradient(135deg,var(--accent),#ff9a3c);border:none;
  border-radius:14px;font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:3px;
  color:#000;cursor:pointer;transition:all .2s;box-shadow:0 8px 30px rgba(247,201,72,.3);}
.signin-btn:hover{transform:translateY(-3px);box-shadow:0 14px 40px rgba(247,201,72,.5);}
.signin-btn:active{transform:translateY(0);}
.field-err{color:var(--accent2);font-size:.85rem;display:none;}
.field-err.show{display:block;}

/* ── SETUP ── */
#setup-screen{justify-content:center;gap:20px;}
.player-badge{background:var(--panel);border:1px solid var(--border);border-radius:50px;
  padding:8px 20px;font-size:.9rem;color:var(--dim);display:flex;align-items:center;gap:8px;}
.player-badge strong{color:var(--accent);}
.setup-card{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:28px;width:100%;max-width:700px;}
.setup-card h3{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:2px;color:var(--accent);margin-bottom:16px;}
.grade-row{display:flex;gap:12px;flex-wrap:wrap;}
.grade-btn{flex:1;min-width:120px;padding:16px;border-radius:14px;border:2px solid var(--border);
  background:rgba(255,255,255,.04);color:var(--text);font-family:'Bebas Neue',sans-serif;
  font-size:1.3rem;letter-spacing:2px;cursor:pointer;transition:all .2s;}
.grade-btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px);}
.grade-btn.selected{background:var(--accent);color:#000;border-color:var(--accent);box-shadow:0 0 20px rgba(247,201,72,.4);}
.teams-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.team-input-wrap{position:relative;}
.team-dot{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:10px;height:10px;border-radius:50%;}
.team-input{width:100%;padding:12px 12px 12px 36px;background:rgba(255,255,255,.06);border:2px solid var(--border);
  border-radius:10px;color:var(--text);font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;transition:border-color .2s;}
.team-input:focus{outline:none;}
.ti1 .team-dot{background:var(--t1);} .ti1 .team-input:focus{border-color:var(--t1);}
.ti2 .team-dot{background:var(--t2);} .ti2 .team-input:focus{border-color:var(--t2);}
.ti3 .team-dot{background:var(--t3);} .ti3 .team-input:focus{border-color:var(--t3);}
.ti4 .team-dot{background:var(--t4);} .ti4 .team-input:focus{border-color:var(--t4);}
.start-btn{width:100%;max-width:700px;padding:18px;background:linear-gradient(135deg,var(--accent),#ff9a3c);
  border:none;border-radius:14px;font-family:'Bebas Neue',sans-serif;font-size:1.8rem;
  letter-spacing:3px;color:#000;cursor:pointer;transition:all .2s;box-shadow:0 8px 30px rgba(247,201,72,.3);}
.start-btn:hover{transform:translateY(-3px);box-shadow:0 14px 40px rgba(247,201,72,.5);}

/* ── GAME ── */
#game-screen{gap:12px;padding:14px;}
.scoreboard{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:900px;}
.sc{border-radius:14px;padding:10px 8px;text-align:center;border:2px solid transparent;transition:all .3s;position:relative;}
.sc.at{transform:scale(1.05);}
.sc1{background:rgba(255,95,109,.1);} .sc1.at{border-color:var(--t1);box-shadow:0 0 20px rgba(255,95,109,.35);}
.sc2{background:rgba(247,201,72,.1);} .sc2.at{border-color:var(--t2);box-shadow:0 0 20px rgba(247,201,72,.35);}
.sc3{background:rgba(67,233,123,.1);} .sc3.at{border-color:var(--t3);box-shadow:0 0 20px rgba(67,233,123,.35);}
.sc4{background:rgba(56,249,215,.1);} .sc4.at{border-color:var(--t4);box-shadow:0 0 20px rgba(56,249,215,.35);}
.sc-name{font-family:'Bebas Neue',sans-serif;font-size:.95rem;letter-spacing:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sc1 .sc-name{color:var(--t1);}.sc2 .sc-name{color:var(--t2);}.sc3 .sc-name{color:var(--t3);}.sc4 .sc-name{color:var(--t4);}
.sc-pts{font-family:'Bebas Neue',sans-serif;font-size:1.9rem;line-height:1;}
.sc-lbl{font-size:.6rem;color:var(--dim);letter-spacing:1px;text-transform:uppercase;}

.hud{display:flex;align-items:center;justify-content:space-between;background:var(--panel);
  border-radius:12px;padding:9px 14px;border:1px solid var(--border);width:100%;max-width:900px;}
.hud-grade{font-family:'Bebas Neue',sans-serif;font-size:.9rem;letter-spacing:2px;color:var(--accent);}
.hud-turn{font-size:.8rem;color:var(--dim);}
.hud-turn b{color:var(--text);}
.hud-qnum{font-family:'Bebas Neue',sans-serif;font-size:.9rem;color:var(--dim);}

.prog-wrap{background:rgba(255,255,255,.06);border-radius:99px;height:5px;overflow:hidden;width:100%;max-width:900px;}
.prog-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .5s;}

.q-card{background:var(--panel);border-radius:20px;padding:26px 22px;text-align:center;
  border:1px solid var(--border);box-shadow:0 10px 40px rgba(0,0,0,.4);width:100%;max-width:900px;}
.q-cat{font-family:'Bebas Neue',sans-serif;letter-spacing:3px;font-size:.8rem;color:var(--accent);margin-bottom:8px;}
.q-text{font-size:clamp(1.05rem,3vw,1.45rem);font-weight:700;line-height:1.4;}
.q-pts{margin-top:10px;display:inline-block;background:rgba(247,201,72,.15);color:var(--accent);
  border-radius:20px;padding:3px 14px;font-family:'Bebas Neue',sans-serif;letter-spacing:2px;font-size:.85rem;}

.ans-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:900px;}
.ans-btn{padding:16px 12px;border-radius:14px;background:rgba(255,255,255,.05);border:2px solid var(--border);
  color:var(--text);font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;
  transition:all .15s;text-align:left;display:flex;align-items:center;gap:10px;}
.ans-btn:hover:not(:disabled){background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);transform:translateY(-2px);}
.ans-btn:disabled{cursor:not-allowed;}
.ans-btn.correct{background:rgba(67,233,123,.2);border-color:var(--accent3);color:var(--accent3);animation:pop .3s;}
.ans-btn.wrong{background:rgba(255,95,109,.2);border-color:var(--t1);color:var(--t1);animation:shake .3s;}
.ans-ltr{width:28px;height:28px;min-width:28px;background:rgba(255,255,255,.1);border-radius:6px;
  display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:1rem;}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}100%{transform:translateX(0)}}

.next-btn{padding:13px 28px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--accent),#ff9a3c);
  color:#000;font-family:'Bebas Neue',sans-serif;font-size:1.25rem;letter-spacing:2px;cursor:pointer;
  transition:all .2s;display:none;box-shadow:0 4px 20px rgba(247,201,72,.3);}
.next-btn.vis{display:block;animation:fadeUp .3s;}
.next-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(247,201,72,.5);}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ── LEADERBOARD PANEL ── */
.lb-panel{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:18px;
  width:100%;max-width:900px;}
.lb-title{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:2px;color:var(--accent);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.lb-rows{display:flex;flex-direction:column;gap:7px;}
.lb-row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);
  border-radius:10px;padding:8px 12px;animation:slideIn .3s;}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
.lb-rank{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:var(--dim);width:24px;text-align:center;}
.lb-name{font-weight:900;flex:1;font-size:.95rem;}
.lb-class{font-size:.75rem;color:var(--dim);padding:2px 8px;background:rgba(255,255,255,.08);border-radius:20px;}
.lb-score{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:var(--accent);}
.lb-empty{color:var(--dim);font-size:.9rem;text-align:center;padding:10px 0;}
.lb-loading{color:var(--dim);font-size:.85rem;text-align:center;}

/* ── FEEDBACK TOAST ── */
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);
  background:var(--panel);border-radius:20px;padding:28px 36px;text-align:center;z-index:200;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1);box-shadow:0 20px 60px rgba(0,0,0,.7);
  border:2px solid transparent;pointer-events:none;min-width:240px;}
.toast.show{transform:translate(-50%,-50%) scale(1);}
.toast.tc{border-color:var(--accent3);}
.toast.tw{border-color:var(--t1);}
.t-icon{font-size:2.8rem;line-height:1;}
.t-msg{font-family:'Bebas Neue',sans-serif;font-size:1.7rem;letter-spacing:2px;margin:6px 0 3px;}
.t-sub{color:var(--dim);font-size:.85rem;}

/* ── WINNER SCREEN ── */
#winner-screen{justify-content:center;gap:18px;}
.w-trophy{font-size:5rem;animation:bounce 1s ease infinite;}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
.w-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(2rem,8vw,4rem);letter-spacing:4px;color:var(--accent);text-align:center;}
.w-card{background:var(--panel);border-radius:20px;padding:28px;width:100%;max-width:500px;border:1px solid var(--border);}
.final-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06);}
.final-row:last-child{border-bottom:none;}
.final-rank{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:var(--dim);width:30px;}
.final-name{font-weight:900;flex:1;padding:0 12px;}
.final-pts{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;}
.w-lb{background:var(--panel);border-radius:20px;padding:24px;width:100%;max-width:500px;border:1px solid var(--border);}
.w-lb h3{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:2px;color:var(--accent);margin-bottom:14px;}
.play-again{padding:15px 36px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--accent),#ff9a3c);
  color:#000;font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:2px;cursor:pointer;
  transition:all .2s;box-shadow:0 8px 30px rgba(247,201,72,.3);}
.play-again:hover{transform:translateY(-3px);}
#confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:50;}

/* ── MOBILE ── */
@media(max-width:520px){
  .scoreboard{grid-template-columns:1fr 1fr;}
  .ans-grid{grid-template-columns:1fr;}
  .teams-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<canvas id="confetti-canvas"></canvas>

<!-- ══ SIGN-IN ══════════════════════════════════════════════ -->
<div id="signin-screen" class="screen active">
  <div class="logo-wrap">
    <div class="logo">🎮 Grammar Quest</div>
    <div class="tagline">The Ultimate Classroom Quiz Show</div>
  </div>
  <div class="signin-card">
    <h2>👋 Sign In to Play</h2>
    <div class="field-group">
      <div>
        <div class="field-label">Your Name</div>
        <input class="field-input" id="si-name" placeholder="Enter your name" maxlength="24" />
      </div>
      <div>
        <div class="field-label">Class Number</div>
        <input class="field-input" id="si-class" placeholder="e.g. 301, 7B, Period 2" maxlength="12" />
      </div>
    </div>
    <div class="field-err" id="si-err">Please enter your name and class number.</div>
    <button class="signin-btn" onclick="doSignIn()">🚀 Let's Play!</button>
  </div>
</div>

<!-- ══ SETUP ══════════════════════════════════════════════════ -->
<div id="setup-screen" class="screen">
  <div class="player-badge">👤 Playing as: <strong id="badge-name"></strong> · Class <strong id="badge-class"></strong></div>
  <div class="logo-wrap" style="text-align:center"><div class="logo" style="font-size:clamp(2rem,6vw,3.5rem)">🎮 Grammar Quest</div></div>

  <div class="setup-card">
    <h3>📚 Select Grade Level</h3>
    <div class="grade-row">
      <button class="grade-btn" onclick="selectGrade(5,this)">5th Grade</button>
      <button class="grade-btn" onclick="selectGrade(6,this)">6th Grade</button>
      <button class="grade-btn" onclick="selectGrade(7,this)">7th Grade</button>
    </div>
  </div>

  <div class="setup-card">
    <h3>🏆 Team Names</h3>
    <div class="teams-grid">
      <div class="team-input-wrap ti1"><span class="team-dot"></span><input class="team-input" id="t1n" maxlength="14" value="Team Red"/></div>
      <div class="team-input-wrap ti2"><span class="team-dot"></span><input class="team-input" id="t2n" maxlength="14" value="Team Gold"/></div>
      <div class="team-input-wrap ti3"><span class="team-dot"></span><input class="team-input" id="t3n" maxlength="14" value="Team Green"/></div>
      <div class="team-input-wrap ti4"><span class="team-dot"></span><input class="team-input" id="t4n" maxlength="14" value="Team Cyan"/></div>
    </div>
  </div>

  <button class="start-btn" onclick="startGame()">🚀 Start the Show!</button>
</div>

<!-- ══ GAME ══════════════════════════════════════════════════ -->
<div id="game-screen" class="screen">
  <div class="scoreboard" id="scoreboard"></div>
  <div class="hud" style="width:100%;max-width:900px;">
    <span class="hud-grade" id="hud-grade"></span>
    <span class="hud-turn">🎤 <b id="hud-team"></b>'s Turn</span>
    <span class="hud-qnum" id="hud-qnum"></span>
  </div>
  <div class="prog-wrap"><div class="prog-bar" id="prog-bar"></div></div>
  <div class="q-card">
    <div class="q-cat" id="q-cat"></div>
    <div class="q-text" id="q-text"></div>
    <div class="q-pts" id="q-pts"></div>
  </div>
  <div class="ans-grid" id="ans-grid"></div>
  <button class="next-btn" id="next-btn" onclick="nextTurn()">NEXT QUESTION ▶</button>

  <!-- Live leaderboard -->
  <div class="lb-panel">
    <div class="lb-title">🏅 Live Leaderboard — Top 5</div>
    <div class="lb-rows" id="lb-rows"><div class="lb-loading">Loading...</div></div>
  </div>
</div>

<!-- ══ WINNER ══════════════════════════════════════════════ -->
<div id="winner-screen" class="screen">
  <div class="w-trophy">🏆</div>
  <div class="w-title" id="w-title"></div>
  <div class="w-card" id="w-scores"></div>
  <div class="w-lb">
    <h3>🌍 All-Time Top 5</h3>
    <div class="lb-rows" id="w-lb-rows"><div class="lb-loading">Loading...</div></div>
  </div>
  <button class="play-again" onclick="resetGame()">🔄 Play Again</button>
</div>

<!-- Feedback toast -->
<div class="toast" id="toast">
  <div class="t-icon" id="t-icon"></div>
  <div class="t-msg" id="t-msg"></div>
  <div class="t-sub" id="t-sub"></div>
</div>

<script>
// ══════════════════════════════════════════════════════════
// CONFIG — Replace with your Render backend URL after deploy
// ══════════════════════════════════════════════════════════
const API = 'https://YOUR-RENDER-APP.onrender.com'; // ← update this

// ══════════════════════════════════════════════════════════
// STARS
// ══════════════════════════════════════════════════════════
const SC = document.getElementById('stars'), SCX = SC.getContext('2d');
function drawStars() {
  SC.width = innerWidth; SC.height = innerHeight; SCX.clearRect(0,0,SC.width,SC.height);
  for(let i=0;i<160;i++){const x=Math.random()*SC.width,y=Math.random()*SC.height,r=Math.random()*1.6;
    SCX.beginPath();SCX.arc(x,y,r,0,Math.PI*2);SCX.fillStyle=`rgba(255,255,255,${Math.random()*.6+.1})`;SCX.fill();}
}
window.addEventListener('resize', drawStars); drawStars();

// ══════════════════════════════════════════════════════════
// QUESTION BANK — 25 per grade
// ══════════════════════════════════════════════════════════
const QB = {
  5:[
    {q:"She baked a cake. What is the direct object?",a:["She","baked","cake","a"],c:2,cat:"Sentence Parts",pts:100},
    {q:"They ___ going to school.",a:["is","are","was","be"],c:1,cat:"Subject-Verb Agreement",pts:100},
    {q:"The book is ___ the table.",a:["run","on","fast","jump"],c:1,cat:"Prepositions",pts:100},
    {q:"Fix the capitalization: 'i like pizza'",a:["I like pizza.","i like pizza","I Like pizza","I like Pizza"],c:0,cat:"Capitalization",pts:100},
    {q:"Which sentence uses a comma correctly?",a:["Yes I like it","Yes, I like it","Yes I, like it","Yes I like, it"],c:1,cat:"Punctuation",pts:100},
    {q:"Which word is an adjective in: 'The tiny blue bird sang.'",a:["bird","sang","tiny","The"],c:2,cat:"Parts of Speech",pts:100},
    {q:"Which is a complete sentence?",a:["Running fast.","The dog barked loudly.","Because it rained.","After school."],c:1,cat:"Sentence Structure",pts:150},
    {q:"Which word is a noun? 'The happy puppy ran quickly.'",a:["happy","ran","quickly","puppy"],c:3,cat:"Parts of Speech",pts:100},
    {q:"What punctuation ends a question?",a:["Period (.)","Exclamation (!)","Question mark (?)","Comma (,)"],c:2,cat:"Punctuation",pts:100},
    {q:"'I went to the store, and I bought milk.' This is a ___.",a:["Simple sentence","Compound sentence","Fragment","Run-on"],c:1,cat:"Sentence Types",pts:150},
    {q:"Which word is a verb? 'The cat quietly sleeps all day.'",a:["cat","quietly","sleeps","all"],c:2,cat:"Parts of Speech",pts:100},
    {q:"Choose the correct spelling.",a:["freind","friend","frend","freiend"],c:1,cat:"Spelling",pts:100},

// ══════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════
let player = null; // { playerId, name, classNumber }
let selectedGrade = null;
let teams = [], scores = [], currentTeam = 0, currentQ = 0;
let questions = [], answered = false;
let lbInterval = null;
const LETTERS = ['A','B','C','D'];
const TC = ['--t1','--t2','--t3','--t4'];
const SC_CLS = ['sc1','sc2','sc3','sc4'];
const MEDALS = ['🥇','🥈','🥉','4️⃣'];
const TC_VAR = ['var(--t1)','var(--t2)','var(--t3)','var(--t4)'];

// ══════════════════════════════════════════════════════════
// SIGN-IN
// ══════════════════════════════════════════════════════════
async function doSignIn() {
  const name = document.getElementById('si-name').value.trim();
  const cls  = document.getElementById('si-class').value.trim();
  const err  = document.getElementById('si-err');
  if (!name || !cls) { err.classList.add('show'); return; }
  err.classList.remove('show');

  try {
    const res = await fetch(`${API}/api/signin`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name, classNumber: cls })
    });
    const data = await res.json();
    player = { playerId: data.playerId, name: data.name, classNumber: data.classNumber };
  } catch {
    // Offline fallback — still let them play
    player = { playerId: `${name}-${cls}`, name, classNumber: cls };
  }

  document.getElementById('badge-name').textContent = player.name;
  document.getElementById('badge-class').textContent = player.classNumber;
  showScreen('setup-screen');
}

// ══════════════════════════════════════════════════════════
// SETUP
// ══════════════════════════════════════════════════════════
function selectGrade(g, btn) {
  selectedGrade = g;
  document.querySelectorAll('.grade-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

function startGame() {
  if (!selectedGrade) { alert('Please select a grade level!'); return; }
  teams = [
    document.getElementById('t1n').value || 'Team Red',
    document.getElementById('t2n').value || 'Team Gold',
    document.getElementById('t3n').value || 'Team Green',
    document.getElementById('t4n').value || 'Team Cyan',
  ];
  scores = [0,0,0,0];
  currentTeam = 0; currentQ = 0; answered = false;
  questions = shuffle([...QB[selectedGrade]]);
  showScreen('game-screen');
  renderScoreboard();
  loadQuestion();
  fetchLeaderboard();
  lbInterval = setInterval(fetchLeaderboard, 15000);
}

// ══════════════════════════════════════════════════════════
// GAME LOOP
// ══════════════════════════════════════════════════════════
function renderScoreboard() {
  document.getElementById('scoreboard').innerHTML = teams.map((t,i) => `
    <div class="sc ${SC_CLS[i]} ${i===currentTeam?'at':''}" id="sc${i}">
      <div class="sc-name">${t}</div>
      <div class="sc-pts" id="pts${i}">${scores[i]}</div>
      <div class="sc-lbl">pts</div>
    </div>`).join('');
}

function updateScoreboard() {
  teams.forEach((_,i) => {
    document.getElementById(`pts${i}`).textContent = scores[i];
    document.getElementById(`sc${i}`).className = `sc ${SC_CLS[i]} ${i===currentTeam?'at':''}`;
  });
}

function loadQuestion() {
  if (currentQ >= questions.length) { endGame(); return; }
  answered = false;
  const q = questions[currentQ];
  document.getElementById('hud-grade').textContent = `${selectedGrade}TH GRADE`;
  const ht = document.getElementById('hud-team');
  ht.textContent = teams[currentTeam];
  ht.style.color = `var(${TC[currentTeam]})`;
  document.getElementById('hud-qnum').textContent = `Q ${currentQ+1}/${questions.length}`;
  document.getElementById('prog-bar').style.width = (currentQ/questions.length*100)+'%';
  document.getElementById('q-cat').textContent = q.cat;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('q-pts').textContent = `+${q.pts} pts`;

  document.getElementById('ans-grid').innerHTML = q.a.map((ans,i) => `
    <button class="ans-btn" onclick="checkAnswer(${i})" id="ab${i}">
      <span class="ans-ltr">${LETTERS[i]}</span>${ans}
    </button>`).join('');
  document.getElementById('next-btn').classList.remove('vis');
}

function checkAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[currentQ];
  document.querySelectorAll('.ans-btn').forEach(b => b.disabled = true);
  document.getElementById(`ab${q.c}`).classList.add('correct');
  if (idx === q.c) {
    scores[currentTeam] += q.pts;
    updateScoreboard();
    showToast(true, q.pts);
    submitScore(q.pts);
  } else {
    document.getElementById(`ab${idx}`).classList.add('wrong');
    showToast(false, q.pts);
  }
  document.getElementById('next-btn').classList.add('vis');
  // refresh leaderboard after every answer
  setTimeout(fetchLeaderboard, 800);
}

function nextTurn() {
  currentQ++;
  currentTeam = (currentTeam+1) % 4;
  updateScoreboard();
  loadQuestion();
}

// ══════════════════════════════════════════════════════════
// LEADERBOARD
// ══════════════════════════════════════════════════════════
async function fetchLeaderboard(targetId = 'lb-rows') {
  try {
    const res = await fetch(`${API}/api/leaderboard`);
    const data = await res.json();
    renderLeaderboard(data.slice(0,5), targetId);
  } catch {
    document.getElementById(targetId).innerHTML = '<div class="lb-empty">Leaderboard offline</div>';
  }
}

function renderLeaderboard(leaders, targetId = 'lb-rows') {
  const el = document.getElementById(targetId);
  if (!leaders.length) { el.innerHTML = '<div class="lb-empty">No scores yet — be the first!</div>'; return; }
  const rankEmoji = ['🥇','🥈','🥉','4️⃣','5️⃣'];
  el.innerHTML = leaders.map((l,i) => `
    <div class="lb-row">
      <span class="lb-rank">${rankEmoji[i]||i+1}</span>
      <span class="lb-name">${l.name}</span>
      <span class="lb-class">Class ${l.classNumber}</span>
      <span class="lb-score">${l.allTimeScore}</span>
    </div>`).join('');
}

// ══════════════════════════════════════════════════════════
// SCORE SUBMISSION
// ══════════════════════════════════════════════════════════
let sessionTotal = 0;
async function submitScore(pts) {
  if (!player) return;
  sessionTotal += pts;
  try {
    await fetch(`${API}/api/score`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        playerId: player.playerId,
        name: player.name,
        classNumber: player.classNumber,
        sessionScore: pts,
        grade: selectedGrade
      })
    });
  } catch { /* offline — silent fail */ }
}

// ══════════════════════════════════════════════════════════
// END GAME
// ══════════════════════════════════════════════════════════
function endGame() {
  clearInterval(lbInterval);
  const sorted = teams.map((t,i) => ({name:t,pts:scores[i],i})).sort((a,b)=>b.pts-a.pts);
  document.getElementById('w-title').textContent = `🏆 ${sorted[0].name} Wins!`;
  document.getElementById('w-scores').innerHTML = sorted.map((t,r) => `
    <div class="final-row">
      <span class="final-rank">${MEDALS[r]}</span>
      <span class="final-name" style="color:${TC_VAR[t.i]}">${t.name}</span>
      <span class="final-pts" style="color:${TC_VAR[t.i]}">${t.pts} pts</span>
    </div>`).join('');
  showScreen('winner-screen');
  fetchLeaderboard('w-lb-rows');
  launchConfetti();
}

function resetGame() {
  stopConfetti(); sessionTotal = 0;
  showScreen('signin-screen');
}

// ══════════════════════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════════════════════
const CORRECT_MSG = ['Correct!','Nailed it!','Outstanding!','Brilliant!','Excellent!'];
const WRONG_MSG   = ['Oops!','Not quite!','Almost!','Keep going!'];
function showToast(ok, pts) {
  const toast = document.getElementById('toast');
  document.getElementById('t-icon').textContent = ok ? ['🎉','⭐','🔥','💥','✨'][Math.floor(Math.random()*5)] : ['😬','😅','🙈','💀'][Math.floor(Math.random()*4)];
  document.getElementById('t-msg').textContent  = ok ? CORRECT_MSG[Math.floor(Math.random()*5)] : WRONG_MSG[Math.floor(Math.random()*4)];
  document.getElementById('t-msg').style.color  = ok ? 'var(--accent3)' : 'var(--t1)';
  document.getElementById('t-sub').textContent  = ok ? `+${pts} points for ${teams[currentTeam]}!` : 'No points this round.';
  toast.className = `toast show ${ok?'tc':'tw'}`;
  setTimeout(() => toast.className='toast', 1500);
}

// ══════════════════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function shuffle(a) { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a; }

// ══════════════════════════════════════════════════════════
// CONFETTI
// ══════════════════════════════════════════════════════════
const CC = document.getElementById('confetti-canvas'), CCX = CC.getContext('2d');
let confettiParts = [], confettiRAF;
function launchConfetti() {
  CC.width = innerWidth; CC.height = innerHeight;
  confettiParts = Array.from({length:130},()=>({
    x:Math.random()*CC.width, y:-20, r:Math.random()*8+4,
    dx:(Math.random()-.5)*4, dy:Math.random()*4+2,
    rot:Math.random()*360, rv:(Math.random()-.5)*6,
    c:['#f7c948','#ff5f6d','#43e97b','#38f9d7','#fff'][Math.floor(Math.random()*5)]
  }));
  animateConfetti();
}
function animateConfetti() {
  CCX.clearRect(0,0,CC.width,CC.height);
  confettiParts.forEach(p=>{p.x+=p.dx;p.y+=p.dy;p.rot+=p.rv;
    CCX.save();CCX.translate(p.x,p.y);CCX.rotate(p.rot*Math.PI/180);
    CCX.fillStyle=p.c;CCX.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);CCX.restore();});
  confettiParts=confettiParts.filter(p=>p.y<CC.height+20);
  if(confettiParts.length) confettiRAF=requestAnimationFrame(animateConfetti);
}
function stopConfetti(){cancelAnimationFrame(confettiRAF);CCX.clearRect(0,0,CC.width,CC.height);}

// Enter key support
document.addEventListener('keydown', e => {
  if (e.key==='Enter') {
    const active = document.querySelector('.screen.active');
    if (active?.id==='signin-screen') doSignIn();
  }
});
</script>
