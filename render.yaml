services:
  - type: web
    name: grammar-quest-api
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false   # paste the JSON string in Render dashboard
      - key: PORT
        value: 3001
